name: tests

# Per project policy CI only runs against the integration branches:
# every PR merging *into* main or dev gets exercised; in-flight feature
# branches don't burn CI minutes per push.
on:
  pull_request:
    branches: [main, dev]

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Run pytest
        # Per-submodule tests are fixture-free.  The .ckp-fixture
        # integration tests live in the parent universal_machinery
        # repo at tests/click/* and run there.
        run: pytest tests/ -q
