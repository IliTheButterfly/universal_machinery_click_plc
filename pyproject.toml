[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "click_plc"
version = "0.1.0"
description = "Read and write AutomationDirect CLICK PLC project files (.ckp)"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
authors = [
    { name = "iliana" },
]
keywords = ["plc", "automationdirect", "click", "ckp", "ladder-logic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
# ``universal_machinery`` is the parent vendor-neutral IL project that
# owns the IL → CLICK lowering this backend's ``write()`` will
# eventually dispatch to.  Not on PyPI yet; consume via the parent
# repo's submodule layout, or pip-install from the parent's git URL
# alongside this package.
dependencies = [
    "universal_machinery",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
ckp-extract = "click_plc.extract_ckp:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["click_plc*"]
